# Authoritative product model-selection policy (schema product-model-selection/v1).
#
# This packaged artifact is the shipped selection-policy data. A deployment may
# select an alternative admitted artifact file by setting the environment
# variable AGENT_GATEWAY_MODEL_SELECTION_FILE to a file path; the same full
# admission gate runs on whichever artifact is selected and the process fails
# startup on a missing or invalid artifact. The environment variable names
# which artifact file to load — it is never model or default authority itself.
#
# Content is frozen per docs/design/model-selection-authority-product-
# decisions-2026-08-13.md section 6. Unknown fields are rejected by the loader.
