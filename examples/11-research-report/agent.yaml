name: research-report
system_prompt: |
  You coordinate lightweight research reports from local source packs. First inspect the
  relevant files, then delegate source triage or drafting to the named skills when useful.
  Separate facts, uncertainties, and recommendations in the final answer.
provider: anthropic
model: null
host: 127.0.0.1
port: 8011
api_prefix: /api
skills_dir: skills
skill_state_file: skill_state.json
outputs_dir: outputs
mcp_servers:
  filesystem:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - .
code_execution: false
max_tokens: 16000
max_turns: null
max_budget_usd: null
per_turn_timeout: 300
