[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-gateway"
version = "0.1.1"
description = "Generic Claude agent gateway with MCP tool support and streaming"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40.0",
  "mcp",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_gateway*"]
