[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-gateway"
version = "0.19.0"
description = "Generic AI agent gateway with MCP tool support and streaming"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=50.0.1",
  "fastapi",
  "jsonschema>=4.26.0",
  "PyJWT>=2.14.0",
  "PyYAML",
  "mcp>=2,<3",
  "fastmcp>=4,<5",
  "httpx>=0.28.1",
  "httpx2>=2.5,<3",
  "pydantic",
  "uvicorn>=0.42.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.6,<2"]
openai = ["openai>=3.14,<4"]
# Supported version is enforced by agent_gateway/providers/agent_sdk.py.
claude = ["claude-agent-sdk==0.2.153"]
all = ["anthropic>=1.6,<2", "openai>=3.14,<4", "claude-agent-sdk==0.2.153"]
dev = ["matplotlib", "pytest", "pytest-asyncio"]
docs = ["mkdocs>=1.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_gateway*", "agent_workflow_contracts*"]

[project.scripts]
agent = "agent_gateway.cli:main"

[tool.setuptools.package-data]
agent_workflow_contracts = [
  "generated/*.d.ts",
  "generated/*.json",
  "generated/*.ts",
]
agent_gateway = [
  "model_authority/*.yaml",
  "rates/*.json",
  "contracts/control-run-v1/*.json",
  "contracts/claim-contract-v1/*.json",
  "contracts/commercial-authority-v1/*.json",
  "contracts/commercial-usage-v3/*.json",
  "contracts/ui-blocks-v1/**/*.json",
  "contracts/canvas-kit-v1/**/*.json",
  "contracts/canvas-kit-v1/**/*.d.ts",
  "contracts/canvas-kit-v1/**/*.tsx",
  "canvas_build/.node-version",
  "canvas_build/*.json",
  "canvas_build/*.mjs",
  "canvas_build/*.sh",
  "contracts/usage-reconciliation-v1/*.json",
  "contracts/usage-reconciliation-v2/*.json",
  "contracts/usage-reconciliation-v3/*.json",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
