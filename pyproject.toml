[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-gateway"
version = "0.15.12"
description = "Generic AI agent gateway with MCP tool support and streaming"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=45.0.0",
  "fastapi",
  "jsonschema>=4.22.0",
  "PyJWT",
  "PyYAML",
  "mcp",
  "fastmcp>=3.2.0",
  "httpx>=0.27.0",
  "pydantic",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.93.0"]
openai = ["openai>=1.0.0"]
all = ["anthropic>=0.93.0", "openai>=1.0.0"]
dev = ["pytest", "pytest-asyncio"]
docs = ["mkdocs>=1.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_gateway*"]

[project.scripts]
agent = "agent_gateway.cli:main"

[tool.setuptools.package-data]
agent_gateway = [
  "rates/*.json",
  "dashboard_artifact/*.json",
  "contracts/claim-contract-v1/*.json",
  "contracts/usage-reconciliation-v1/*.json",
  "contracts/usage-reconciliation-v2/*.json",
]
